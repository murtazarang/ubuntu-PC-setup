name: AX206 startup safe checks
on:
  push:
    branches: [fix/ax206-autostart]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Parse display scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/aida64_display -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Windows PowerShell mocked tests
        shell: powershell
        run: |
          ./windows/aida64_display/tests/test-autostart.ps1
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
      - name: PowerShell 7 mocked tests
        shell: pwsh
        run: |
          ./windows/aida64_display/tests/test-autostart.ps1
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
      - name: Python tests
        shell: pwsh
        run: uv run --no-project --with pillow python -m unittest discover -s windows/aida64_display/tests -v
