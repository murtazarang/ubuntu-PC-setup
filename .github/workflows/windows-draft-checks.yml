name: Windows draft checks
on:
  push:
    paths:
      - 'windows/**'
      - '*.sh'
      - 'create-colibri-shortcuts.py'
      - 'create-openwebui-services.py'
      - 'openwebui_*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/colibri/**'
      - 'download_colibri_model.py'
      - 'colibri-models.json'
      - '.github/workflows/windows-draft-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Parse PowerShell without executing installers
        shell: pwsh
        run: ./windows/test-powershell.ps1
      - name: Execute launcher binding test (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/test-launcher-binding.ps1
      - name: Execute launcher binding test (PowerShell 7)
        shell: pwsh
        run: ./windows/test-launcher-binding.ps1
      - name: Test PowerShell discovery in Windows PowerShell 5.1
        shell: powershell
        run: ./windows/test-pwsh-resolution.ps1
      - name: Test PowerShell discovery in PowerShell 7
        shell: pwsh
        run: ./windows/test-pwsh-resolution.ps1
      - name: Test PowerShell candidate and arguments (5.1)
        shell: powershell
        run: |
          ./windows/test-pwsh-candidate.ps1
          ./windows/test-launcher-arguments.ps1
      - name: Test PowerShell candidate and arguments (7)
        shell: pwsh
        run: |
          ./windows/test-pwsh-candidate.ps1
          ./windows/test-launcher-arguments.ps1
      - name: Execute mocked update tests
        shell: pwsh
        run: ./windows/tests/test-updates.ps1
      - name: Execute mocked application detection tests
        shell: pwsh
        run: ./windows/test-app-detection.ps1
      - name: Execute mocked Everything tests
        shell: pwsh
        run: ./windows/tests/test-everything.ps1
      - name: Test AI and PATH regressions
        shell: pwsh
        run: |
          ./windows/test-ai-regressions.ps1
          ./windows/tests/test-setup-path.ps1
      - name: Exercise SignalRGB detection safely
        shell: pwsh
        run: ./windows/test-signalrgb-detection.ps1
      - name: Test existing OMP detection
        shell: pwsh
        run: ./windows/tests/test-omp-existing.ps1
      - name: Test offline reference and desktop safety
        shell: pwsh
        run: |
          ./windows/tests/test-reference.ps1
          ./windows/tests/test-desktop-discovery.ps1
          ./windows/tests/test-firefox-scope.ps1
      - name: Test Firefox installer selection
        shell: pwsh
        run: ./windows/tests/test-firefox-installer-type.ps1
      - name: Test effective OMP model reporting
        shell: pwsh
        run: ./windows/test-model-effective.ps1
      - name: Run isolated Python tests
        shell: pwsh
        run: uv run --no-project --with PyYAML python -m unittest discover -s windows/tests -v
      - name: AX206 service safe tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
          ./windows/aida64_display/tests/test-service.ps1
          ./windows/aida64_display/tests/test-migration.ps1
      - name: AX206 service safe tests (PowerShell 7)
        shell: pwsh
        run: |
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
          ./windows/aida64_display/tests/test-service.ps1
          ./windows/aida64_display/tests/test-migration.ps1
      - name: AX206 lifecycle and simulated USB tests
        shell: pwsh
        run: uv run --no-project --with Pillow --with PyYAML python -m unittest discover -s windows/aida64_display/tests -v
      - name: Actual AX206 runtime staging (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/aida64_display/tests/test-runtime.ps1
      - name: Actual AX206 runtime staging (PowerShell 7)
        shell: pwsh
        run: ./windows/aida64_display/tests/test-runtime.ps1
      - name: Legacy cleanup fixture (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/test-legacy-cleanup.ps1
      - name: Legacy cleanup fixture (PowerShell 7)
        shell: pwsh
        run: ./windows/test-legacy-cleanup.ps1
      - name: Paseo registered uninstall arguments (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/test-paseo-uninstall.ps1
      - name: Paseo registered uninstall arguments (PowerShell 7)
        shell: pwsh
        run: ./windows/test-paseo-uninstall.ps1
      - name: Open WebUI migration fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/test-openwebui-migration.ps1
      - name: Open WebUI migration fixtures (PowerShell 7)
        shell: pwsh
        run: ./windows/test-openwebui-migration.ps1
      - name: Open WebUI lifecycle safe fixtures
        shell: pwsh
        run: uv run --no-project --with psutil==7.2.2 python windows/test_openwebui_desktop.py
      - name: Colibri native Serve shortcut (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/tests/test-colibri-serve-shortcut.ps1
      - name: Colibri native Serve shortcut (PowerShell 7)
        shell: pwsh
        run: ./windows/tests/test-colibri-serve-shortcut.ps1
      - name: Colibri model ownership fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: ./windows/tests/test-colibri-model-ownership.ps1
      - name: Colibri model ownership fixtures (PowerShell 7)
        shell: pwsh
        run: ./windows/tests/test-colibri-model-ownership.ps1
      - name: Model downloader safe transfer fixtures
        shell: pwsh
        run: uv run --no-project python -m unittest discover -s tests -p 'test_*model*.py' -v
      - name: Actual Colibri UI install and rerun (no models or GPU)
        shell: pwsh
        run: ./windows/tests/test-colibri-install.ps1

  linux-safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux setup tests without installation
        run: |
          command -v gio
          command -v cc
          python3 -m unittest discover -s tests -v

  openwebui-protocol-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install disposable protocol-test environments (CPU only; not user deployment)
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/webui"
          uv pip install --python "$RUNNER_TEMP/webui/bin/python" --torch-backend cpu 'open-webui==0.13.4' 'torch==2.9.1'
          uv venv --python 3.12 "$RUNNER_TEMP/mcpo"
          uv pip install --python "$RUNNER_TEMP/mcpo/bin/python" 'mcpo==0.0.20' 'mcp==1.30.0' 'fastapi==0.115.12'
          uv venv --python 3.12 "$RUNNER_TEMP/zim"
          uv pip install --python "$RUNNER_TEMP/zim/bin/python" 'openzim-mcp==3.4.0'
      - name: Fetch and verify official small Wikipedia test archive
        run: |
          mkdir -p "$RUNNER_TEMP/zim-fixture"
          curl --fail --location --retry 3 --max-time 180 'https://raw.githubusercontent.com/openzim/zim-testing-suite/main/data/withns/wikipedia_en_climate_change_mini_2024-06.zim' -o "$RUNNER_TEMP/zim-fixture/climate.zim"
          echo "72db7ae7708d3a4cff918495078901ec027b14b427433a2328286ec130d1c43b  $RUNNER_TEMP/zim-fixture/climate.zim" | sha256sum --check
      - name: Prepare all three complete audited skill repositories
        run: python3 openwebui_skills.py prepare --root "$RUNNER_TEMP/skill-repos"
      - name: Real WebUI skills and Wikipedia roundtrip with simulated inference
        run: |
          python3 tests/openwebui_runtime_smoke.py --webui-exe "$RUNNER_TEMP/webui/bin/open-webui" --mcpo-exe "$RUNNER_TEMP/mcpo/bin/mcpo" --openzim-exe "$RUNNER_TEMP/zim/bin/openzim-mcp" --archive-dir "$RUNNER_TEMP/zim-fixture" --skills-root "$RUNNER_TEMP/skill-repos"
