name: AX206 safe branch checks
on:
  push:
    branches: [fix/ax206-portrait]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Parse AX206 scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/aida64_display -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: AX206 setup mocks PowerShell 5.1
        shell: powershell
        run: ./windows/aida64_display/tests/test-setup.ps1
      - name: AX206 setup mocks PowerShell 7
        shell: pwsh
        run: ./windows/aida64_display/tests/test-setup.ps1
      - name: AX206 Python tests
        shell: pwsh
        run: uv run --no-project --with pillow python -m unittest discover -s windows/aida64_display/tests -v
