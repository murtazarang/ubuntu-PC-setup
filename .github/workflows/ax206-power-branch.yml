name: AX206 power safe checks
on:
  push:
    branches: [fix/ax206-power]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Parse scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/aida64_display -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Windows PowerShell 5.1 mocked tests
        shell: powershell
        run: |
          ./windows/aida64_display/tests/test-autostart.ps1
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
      - name: PowerShell 7 mocked tests
        shell: pwsh
        run: |
          ./windows/aida64_display/tests/test-autostart.ps1
          ./windows/aida64_display/tests/test-setup.ps1
          ./windows/aida64_display/tests/test-launcher.ps1
      - name: Python and real HWND synthetic messages
        shell: pwsh
        run: |
          uv venv --python 3.11 .ax-ci
          uv pip install --python .ax-ci/Scripts/python.exe pillow
          & ./.ax-ci/Scripts/python.exe -m unittest discover -s windows/aida64_display/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: pythonw hidden-window synthetic test
        shell: pwsh
        run: |
          @'
          import pathlib, sys, unittest
          log = pathlib.Path("pythonw-test.log").open("w", encoding="utf-8")
          sys.stdout = sys.stderr = log
          suite = unittest.defaultTestLoader.discover("windows/aida64_display/tests", pattern="test_power_events.py")
          result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          log.close()
          sys.exit(0 if result.wasSuccessful() else 1)
          '@ | Set-Content -Encoding utf8 pythonw-test.py
          $p = Start-Process ./.ax-ci/Scripts/pythonw.exe -ArgumentList pythonw-test.py -Wait -PassThru
          Get-Content pythonw-test.log
          if ($p.ExitCode -ne 0) { throw 'pythonw tests failed' }
